# /etc/tmpfiles.d/rpi-player-cpufreq.conf
#
# Grants the unprivileged "rpi" service user write access to the CPU
# frequency governor, so streamdeck_daemon.py (player/cpugov.py) can drop
# clock speed while idle to cut down on heat, and restore it instantly on
# any key press or when playback resumes -- without needing root or a
# per-write sudo prompt (same category of problem as the shutdown/Wi-Fi
# polkit rules, just for a sysfs attribute instead of a D-Bus action).
#
# These paths are created by the kernel at boot, not real files on disk --
# a one-time `chmod` would not survive a reboot, which is exactly what
# tmpfiles.d is for: systemd-tmpfiles-setup.service re-applies this on
# every boot, after the kernel has created the cpufreq sysfs tree.
#
# Type 'z': adjust ownership/mode of an already-existing path, do not
# create or remove it. Fails harmlessly (logged, not fatal) if a path is
# missing -- e.g. a board with fewer than 4 cores, or cpufreq disabled.
#
# Type Path                                                       Mode UID  GID  Age
z      /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor       0664 -    rpi  -
z      /sys/devices/system/cpu/cpu1/cpufreq/scaling_governor       0664 -    rpi  -
z      /sys/devices/system/cpu/cpu2/cpufreq/scaling_governor       0664 -    rpi  -
z      /sys/devices/system/cpu/cpu3/cpufreq/scaling_governor       0664 -    rpi  -
