#
# /etc/samba/smb.conf  —  RPi-Audio music share
#
# Goal: frictionless drag-and-drop from macOS Finder AND Windows Explorer,
# with the Pi appearing automatically in the sidebar on both.
#
# Install:  sudo apt install -y samba samba-common-bin avahi-daemon
# Test:     testparm -s
# Apply:    sudo systemctl restart smbd nmbd avahi-daemon
#
# NOTE: Samba needs its own password even though the Unix user exists:
#   sudo smbpasswd -a rpi
#

[global]
   workgroup = WORKGROUP
   server string = RPi Audio Player
   netbios name = RPI-AUDIO
   security = user
   map to guest = never

   # --- Protocol ----------------------------------------------------------
   # SMB2 minimum. SMB1 is insecure and modern macOS/Windows refuse it anyway.
   server min protocol = SMB2
   client min protocol = SMB2

   # --- Discovery ---------------------------------------------------------
   # mDNS registration so the Pi shows up in Finder without typing an address.
   # 'yes' uses Avahi. Windows discovery comes from nmbd + WSD (see below).
   multicast dns register = yes

   # --- Performance for large FLAC/DSD transfers over Wi-Fi ---------------
   socket options = TCP_NODELAY IPTOS_LOWDELAY
   use sendfile = yes
   aio read size = 16384
   aio write size = 16384
   strict sync = no

   # --- Logging (keep small; this is an SD/NVMe embedded device) ----------
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d

   # --- Don't advertise printers we don't have ----------------------------
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   show add printer wizard = no


[Music]
   comment = RPi-Audio Music Library (Internal)
   # Points directly at the -internal directory, NOT the /home/rpi/Music
   # symlink -- the symlink target follows whichever storage source is
   # currently toggled active on the Stream Deck (internal vs USB), so
   # pointing this share at it would make "Music" silently show USB
   # content whenever USB is the active playback source. This share is
   # always internal; use "Audio (USB)" below for the USB drive.
   path = /home/rpi/Music-internal
   browseable = yes
   read only = no
   writeable = yes
   guest ok = no
   valid users = rpi
   force user = rpi
   force group = rpi

   # New files land owned by rpi and readable by MPD.
   create mask = 0664
   force create mode = 0664
   directory mask = 0775
   force directory mode = 0775

   # --- macOS compatibility ----------------------------------------------
   # catia          : translates characters illegal on Windows (: * ? " < > |)
   # fruit          : Apple SMB extensions — resource forks, Finder metadata
   # streams_xattr  : REQUIRED backing store for fruit; must come after it
   #
   # Order matters. fruit must precede streams_xattr.
   vfs objects = catia fruit streams_xattr

   fruit:metadata = stream
   fruit:model = MacPro
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

   # Stop Time Machine trying to back up to the music share.
   fruit:time machine = no

   # --- Keep junk out of the library --------------------------------------
   # MPD will happily try to index these otherwise.
   veto files = /.DS_Store/._*/.Trashes/.Spotlight-V100/.fseventsd/Thumbs.db/desktop.ini/
   delete veto files = yes

[Video]
   comment = RPi-SKP Video Library (Internal)
   # Same reasoning as [Music] above -- points at -internal directly so it
   # doesn't follow the storage-toggle symlink. Use "Video (USB)" for USB.
   path = /home/rpi/Video-internal
   browseable = yes
   read only = no
   writeable = yes
   guest ok = no
   valid users = rpi
   force user = rpi
   force group = rpi

   create mask = 0664
   force create mode = 0664
   directory mask = 0775
   force directory mode = 0775

   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacPro
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
   fruit:time machine = no

   veto files = /.DS_Store/._*/.Trashes/.Spotlight-V100/.fseventsd/Thumbs.db/desktop.ini/
   delete veto files = yes

# --- USB drive shares -------------------------------------------------------
# [Music]/[Video] above are always internal (they point at the -internal
# dirs directly, not the storage-toggle symlink). These two shares are the
# USB counterpart: static, pointing directly at the USB drive's Audio/Video
# folders regardless of which source is currently toggled active for
# playback on the Stream Deck.
#
# IMPORTANT: the USB drive is FAT32/vfat, which has NO extended attribute
# (xattr) support. The 'fruit'/'streams_xattr' VFS modules used on [Music]/
# [Video] above require xattrs to store Apple metadata -- using them here
# causes every write to fail, leaving 0-byte files behind. So these two
# shares intentionally omit fruit/streams_xattr and only keep 'catia' for
# illegal-character translation (which doesn't need xattr support).

[Audio (USB)]
   comment = RPi-Audio USB Drive - Audio
   path = /mnt/usb-storage/Audio
   browseable = yes
   read only = no
   writeable = yes
   guest ok = no
   valid users = rpi
   force user = rpi
   force group = rpi

   create mask = 0664
   force create mode = 0664
   directory mask = 0775
   force directory mode = 0775

   # No fruit/streams_xattr here -- FAT32 has no xattr support (see note above).
   vfs objects = catia

   veto files = /.DS_Store/._*/.Trashes/.Spotlight-V100/.fseventsd/Thumbs.db/desktop.ini/
   delete veto files = yes

[Video (USB)]
   comment = RPi-SKP USB Drive - Video
   path = /mnt/usb-storage/Video
   browseable = yes
   read only = no
   writeable = yes
   guest ok = no
   valid users = rpi
   force user = rpi
   force group = rpi

   create mask = 0664
   force create mode = 0664
   directory mask = 0775
   force directory mode = 0775

   # No fruit/streams_xattr here -- FAT32 has no xattr support (see note above).
   vfs objects = catia

   veto files = /.DS_Store/._*/.Trashes/.Spotlight-V100/.fseventsd/Thumbs.db/desktop.ini/
   delete veto files = yes
