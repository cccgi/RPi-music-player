# Samba shares for the Music and Video/karaoke libraries.
#
# install.sh sed-substitutes the placeholder paths and user below to match
# the actual install (see install.sh's "Configuring Samba" step):
#   /home/pi/Music -> $MUSIC_DIR   (also matches /home/pi/Video -> $VIDEO_DIR)
#   valid/force user/group = pi -> $SERVICE_USER
#
# NOTE: this file was missing from the repo entirely until the touch-ui
# branch's SMB fix — install.sh referenced it (`$SRC/system/samba/smb.conf`)
# but nothing ever created it, so every fresh install's Samba step silently
# had nothing to sed and no share ever got configured. This is the
# from-scratch template that step assumes exists.
[global]
   workgroup = WORKGROUP
   server string = %h
   security = user
   map to guest = bad user
   dns proxy = no
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d
   server role = standalone server
   obey pam restrictions = yes
   unix password sync = yes
   passwd program = /usr/bin/passwd %u
   pam password change = yes

[Music]
   comment = RPi Music Player - Music library
   path = /home/pi/Music
   browseable = yes
   read only = no
   guest ok = no
   valid users = pi
   force user = pi
   force group = pi
   create mask = 0664
   directory mask = 0775

[Video]
   comment = RPi Music Player - Video/karaoke library
   path = /home/pi/Video
   browseable = yes
   read only = no
   guest ok = no
   valid users = pi
   force user = pi
   force group = pi
   create mask = 0664
   directory mask = 0775
