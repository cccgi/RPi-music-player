#
# /etc/mpd.conf  —  RPi portable player
#
# THREE outputs, but only two "layers":
#
#   [0] "Local"    -> ALSA hw: direct to the USB DAC. Bit-perfect, exclusive.
#   [1] "Network"  -> PipeWire. Bluetooth AND AirPlay both live behind this.
#   [2] "HDMI"     -> ALSA plughw: to the Pi's HDMI (convenience only).
#
# Bluetooth vs AirPlay is NOT an MPD-level choice — both are PipeWire sinks.
# Switching between them means changing PipeWire's default sink (wpctl
# set-default) while MPD keeps sending to the same "Network" output.
# player/outputs.py implements exactly this two-layer model.
#

music_directory     "/home/pi/Music"
playlist_directory  "/var/lib/mpd/playlists"
db_file             "/var/lib/mpd/tag_cache"
state_file          "/var/lib/mpd/state"
sticker_file        "/var/lib/mpd/sticker.sql"

# user/group are set by the systemd override (mpd runs as the desktop user so
# it can reach that user's PipeWire socket). Do NOT re-enable them here.
#user               "mpd"
#group              "audio"

bind_to_address     "127.0.0.1"
port                "6600"
bind_to_address     "/run/mpd/socket"

log_file            "syslog"
log_level           "notice"

restore_paused      "yes"
auto_update         "yes"
auto_update_depth   "6"

zeroconf_enabled    "yes"
zeroconf_name       "RPi-Audio"

replaygain           "off"
volume_normalization "no"

input {
    plugin "curl"
}

#
# ---------------------------------------------------------------------------
# OUTPUT 0 — Local wired DAC (Sound Blaster Play! 3) — BIT PERFECT
# ---------------------------------------------------------------------------
# "hw:", NOT "plughw:". We want MPD talking to the hardware with no conversion
# layer. Verified capabilities of this card:
#
#   FORMAT: S16_LE S24_3LE
#   RATES:  44100, 48000, 88200, 96000
#
# so normal material plays natively with no resampling at all.
#
# auto_* are "no" so MPD refuses to silently convert. If something cannot play
# natively you WANT to hear about it rather than get a quiet downgrade.
#
# REQUIRES WirePlumber to be ignoring this card, otherwise the open fails with
# "Device or resource busy". See:
#   /etc/wireplumber/wireplumber.conf.d/51-mpd-dac-ignore.conf
#
# Uses hw:CARD=S3 (the card's ID) rather than hw:2 — card NUMBERS shuffle when
# USB devices enumerate in a different order, names do not.
#
audio_output {
    type            "alsa"
    name            "Local"
    device          "hw:CARD=S3,DEV=0"
    mixer_type      "software"
    auto_resample   "no"
    auto_format     "no"
    auto_channels   "no"
    enabled         "yes"
}

#
# ---------------------------------------------------------------------------
# OUTPUT 1 — PipeWire (carries Bluetooth A2DP and AirPlay/RAOP)
# ---------------------------------------------------------------------------
# No target= on purpose: it follows PipeWire's *default* sink, which the router
# changes with `wpctl set-default`. One MPD output, many wireless destinations.
#
audio_output {
    type            "pipewire"
    name            "Network"
    mixer_type      "software"
    enabled         "no"
}

#
# ---------------------------------------------------------------------------
# OUTPUT 2 — HDMI (convenience)
# ---------------------------------------------------------------------------
# "plughw:", not "hw:" — vc4hdmi accepts ONLY IEC958_SUBFRAME_LE, so a bare
# hw: device rejects plain PCM with "Failed to configure format". The plug
# layer converts. Losing bit-perfect here costs nothing; the DAC above is the
# quality path. See docs/AUDIO-OUTPUT.md section 2.
#
audio_output {
    type            "alsa"
    name            "HDMI"
    device          "plughw:CARD=vc4hdmi0,DEV=0"
    mixer_type      "software"
    enabled         "no"
}

#
# ---------------------------------------------------------------------------
# OUTPUT 3 — Visualizer tap (touch UI's audio-reactive spectrum, music mode)
# ---------------------------------------------------------------------------
# NOT a real destination — nothing routes to this from player/outputs.py,
# and it never appears in the BT/AirPlay/Local picker. MPD writes a SECOND
# copy of the same already-decoded PCM it's sending to whichever real
# output above is active into this named pipe, at effectively zero extra
# cost (no re-decode, no second playback pipeline) — see
# player/audio_visualizer.py's module docstring for the reader on the
# other end. `format` pins the fifo to a fixed layout regardless of the
# source file's own sample rate/bit depth, so the reader never has to
# handle format changes mid-track. Always enabled: harmless if nothing is
# reading it (MPD just writes into the pipe's kernel buffer; a full pipe
# with no reader would block MPD, which is why the reader thread keeps the
# fifo open O_RDWR on its side — see audio_visualizer.py's comment on that
# — guaranteeing a reader is always attached once the touch daemon starts).
#
audio_output {
    type            "fifo"
    name            "Visualizer"
    path            "/run/mpd/visualizer.fifo"
    format          "44100:16:2"
    enabled         "yes"
}
