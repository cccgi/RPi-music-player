# /etc/pipewire/pipewire.conf.d/10-raop-discover.conf
#
# Enables AirPlay speaker discovery + output. Without this, the "airplay"
# route in config.toml (pw_sink = "raop_sink") can never find anything —
# PipeWire never creates raop_sink nodes at all until this module is loaded,
# regardless of what speakers are actually on the network.
#
# The module itself (libpipewire-module-raop-discover.so) already ships with
# the pipewire packages this project depends on — nothing to install, only
# to turn on. It watches mDNS for _raop._tcp announcements and creates one
# PipeWire sink per AirPlay receiver it finds, named so it matches the
# existing "raop_sink" substring match in OutputRouter/PwSink.matches().
#
# Verify after applying:
#   systemctl --user restart pipewire pipewire-pulse wireplumber
#   wpctl status | grep -i raop        # one line per AirPlay speaker found
#   avahi-browse -rt _raop._tcp        # confirms what's actually on the LAN
context.modules = [
    { name = libpipewire-module-raop-discover }
]
