# /etc/wireplumber/wireplumber.conf.d/51-mpd-dac-ignore.conf
#
# THE MOST IMPORTANT FILE IN THE BUILD FOR BIT-PERFECT PLAYBACK.
#
# Problem: WirePlumber claims every ALSA card it finds. Once it holds the USB
# DAC, MPD's `type "alsa"` output cannot open hw: exclusively — playback fails
# with "Device or resource busy", or worse, silently gets resampled through
# PipeWire's graph and the whole point of the wired path is lost.
#
# Fix: tell WirePlumber this specific card is not its business.
#   MPD owns the wired DAC.
#   PipeWire owns Bluetooth and AirPlay.
# Clean separation, nothing fighting.
#
# Verify AFTER applying:
#   systemctl --user restart wireplumber
#   wpctl status | grep -i blaster        # must print NOTHING
#   mpc enable only Local && mpc play     # must not say "device busy"
#   cat /proc/asound/card2/pcm0p/sub0/hw_params   # rate must match the file

monitor.alsa.rules = [
  {
    matches = [
      {
        # Matched against the VERIFIED device.name from pw-dump:
        #   alsa_card.usb-Creative_Technology_Ltd_Sound_Blaster_Play__3_YDSB1730602005684P-00
        #
        # The glob deliberately stops before the serial number
        # (YDSB1730602005684P) so replacing the unit does not silently
        # re-expose the card to PipeWire.
        device.name = "~alsa_card.usb-Creative_Technology_Ltd_Sound_Blaster_Play.*"
      }
    ]
    actions = {
      update-props = {
        # Do not create PipeWire nodes for this card at all.
        device.disabled = true
      }
    }
  }
]

#
# ---------------------------------------------------------------------------
# Bluetooth behaviour for headphones
# ---------------------------------------------------------------------------
monitor.bluez.properties = {
  # ---------------------------------------------------------------------
  # DO NOT set bluez5.roles here. Read this before "tidying" it.
  # ---------------------------------------------------------------------
  # An earlier version restricted roles to:
  #
  #     bluez5.roles = [ a2dp_sink ]
  #
  # intending "A2DP only, never HFP". That is NOT what the setting means.
  # The roles describe what the LOCAL machine does:
  #
  #     a2dp_sink    the Pi RECEIVES audio (a phone streams to the Pi)
  #     a2dp_source  the Pi SENDS audio    (the Pi streams to headphones)
  #
  # Restricting to a2dp_sink removed the ability to drive headphones. The
  # symptom is subtle: bluetoothctl reports "Connected: yes", pairing and
  # trust are fine, no error anywhere — but no bluez_output sink is created
  # and the only card profile offered is "Audio Gateway", i.e. PipeWire
  # waiting for the headphones to stream TO the Pi.
  #
  # Leaving roles unset uses PipeWire's default, which includes both
  # directions. HFP degradation is prevented by autoswitch-profile below,
  # which is the correct control for that concern.

  # Bose devices do SBC and AAC only; Debian ships PipeWire WITHOUT the AAC
  # encoder (fdk-aac is non-free), so a QC45 negotiates SBC. SBC-XQ is the
  # upgrade available and is selected per-device via the card profile.
  bluez5.codecs = [ ldac aptx_hd aptx aac sbc_xq sbc ]

  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc  = false
  bluez5.enable-hw-volume = true

  # THIS is what stops headphones dropping into 8 kHz HSP/HFP the moment
  # something looks like it wants a microphone — the actual cause of "my
  # Bluetooth audio suddenly sounds like a telephone".
  bluez5.autoswitch-profile = false
}
