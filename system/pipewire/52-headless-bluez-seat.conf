# /etc/wireplumber/wireplumber.conf.d/52-headless-bluez-seat.conf
#
# ROOT CAUSE of "reconnecting Bluetooth headphones takes forever / pairing a
# new device fails almost every time" (found 2026-08-11 chasing repeated
# `bluetoothctl connect` failures with `org.bluez.Error.Failed
# br-connection-profile-unavailable`).
#
# WirePlumber's bluez5 monitor (monitors/bluez.lua) does not start
# unconditionally. If logind support is compiled in — which it is on stock
# Raspberry Pi OS — the monitor waits for the seat to report state
# "active" before it ever calls createMonitor():
#
#     if seat_state == "active" then
#       monitor = createMonitor()
#     ...
#
# "active" means a real, focused login on a seat — a console or graphical
# session. This box has neither. It runs headless: WirePlumber/PipeWire
# live entirely under `loginctl enable-linger rpi` (see install.sh and
# DEPLOY.md step 6) so the user session exists at boot with no interactive
# login ever attached. logind reports that kind of session as "online",
# never "active" — so `monitor = createMonitor()` never runs, ever, no
# matter how long the box has been up.
#
# The effect is total and silent: no bluez5 SPA device monitor means no
# adapter is ever enumerated, no AVDTP media endpoints are ever registered
# with bluezd (`busctl tree org.bluez` shows zero `MediaEndpoint` objects,
# confirmed live), and bluetoothd has nothing to offer when a remote device
# asks for A2DP — hence a connect attempt fails immediately and
# deterministically with br-connection-profile-unavailable, every single
# time, for every device, paired or not. It has nothing to do with signal
# strength, retries, or which headphones/speaker/head unit is involved —
# match the symptom, not the specific device, when this bites again.
#
# Fix: this box has no seat to wait for, so stop waiting for one. Same
# override `mixin.systemwide-session` already uses for the same reason —
# see monitor.bluez.seat-monitoring's definition in
# /usr/share/wireplumber/wireplumber.conf.
#
# Verify AFTER applying:
#   systemctl --user restart wireplumber
#   busctl tree org.bluez | grep MediaEndpoint     # must print several lines
#   bluetoothctl connect <mac>                     # should now succeed on
#                                                   # the first real attempt

wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
