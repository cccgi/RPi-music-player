# /etc/NetworkManager/conf.d/wifi-powersave-off.conf
#
# Disables Wi-Fi power management. Without this, the brcmfmac driver on the
# Pi's onboard Broadcom chip runs with power save ON by default (confirmed
# live: `iw dev wlan0 get power_save` -> "on"), which aggressively sleeps
# the radio between beacon intervals to save power.
#
# That's the actual cause of "iffy Wi-Fi" symptoms that look nothing like a
# signal/range problem -- found live sitting right next to a laptop and a
# desktop both on rock-solid Wi-Fi, with the Pi itself reporting excellent
# signal the whole time (-41 dBm, 75%, 5GHz channel 36, right next to the
# AP): SSH sessions randomly timing out, and AirPlay speakers vanishing
# from the Video page's picker -- mDNS discovery relies on receiving
# multicast announcements, which are exactly the kind of traffic that gets
# delayed or dropped while the radio is asleep between beacons. A signal
# strength check alone will never catch this; it's a power-management
# setting, not a coverage problem.
#
# 2 = NM_SETTING_WIRELESS_POWERSAVE_DISABLE. NetworkManager applies this to
# wlan0 every time it (re)activates the connection, overriding whatever the
# driver's own default is -- so this survives reboots and reconnects, not
# just a one-off `iw dev wlan0 set power_save off` that a driver reload
# would silently undo.
[connection]
wifi.powersave = 2
