# /etc/systemd/system/mpd.service.d/override.conf
#
# Run MPD as the desktop user so it can reach that user's PipeWire socket.
#
# ---------------------------------------------------------------------------
# WHY
# ---------------------------------------------------------------------------
# Debian's mpd.service runs as User=mpd (a system account). PipeWire runs as a
# *per-user* service, with its socket at /run/user/<uid>/pipewire-0, owned by
# and only accessible to that user.
#
# So a stock MPD physically cannot open PipeWire, and the symptom is:
#
#     Failed to open "Network" (pipewire); Failed to connect stream: Host is down
#
# "Host is down" is misleading — nothing is down, MPD simply cannot see the
# socket. Local ALSA output keeps working, which makes it look like Bluetooth
# is broken rather than a permissions boundary.
#
# ---------------------------------------------------------------------------
# THE FIX
# ---------------------------------------------------------------------------
# On a single-user appliance the clean answer is to run MPD as that user. It
# then shares the session's PipeWire and can still open ALSA hw: devices
# directly for the bit-perfect wired path, because the user is in `audio`.
#
# The alternatives are worse:
#   * system-wide PipeWire  — upstream advises against it; loses session
#     integration and Bluetooth agent behaviour.
#   * ACLs on the socket    — works, but breaks whenever the runtime dir is
#     recreated, i.e. on every reboot without lingering.
#   * MPD's `pulse` output over TCP — adds a network hop and a second daemon
#     for no benefit here.
#
# ---------------------------------------------------------------------------
# REQUIREMENTS
# ---------------------------------------------------------------------------
#   loginctl enable-linger rpi          # /run/user/1000 must exist at boot,
#                                       # before anyone logs in
#   chown -R rpi:rpi /var/lib/mpd       # state, database and playlists
#   usermod -aG audio rpi               # direct ALSA access for the DAC
#
# Set UID correctly if your user is not 1000: `id -u rpi`
#
# Apply:
#   sudo systemctl daemon-reload && sudo systemctl restart mpd

# Ordering directives belong in [Unit]. systemd silently ignores After=/Wants=
# placed in [Service] — it logs "Unknown key ... ignoring" and carries on, so
# the dependency you thought you declared simply is not there.
[Unit]
After=user@1000.service
Wants=user@1000.service

[Service]
User=pi
Group=pi
SupplementaryGroups=audio

# Where the user's PipeWire socket lives. Without this MPD does not know where
# to look even when it has permission.
Environment=XDG_RUNTIME_DIR=/run/user/1000
Environment=PIPEWIRE_RUNTIME_DIR=/run/user/1000

# The stock unit creates /run/mpd owned by the OLD user (mpd). Changing User=
# does not retroactively fix an existing directory, and a leftover socket file
# makes startup fail with:
#     Failed to bind to '/run/mpd/socket': Address already in use
# Re-declaring RuntimeDirectory makes systemd recreate it with correct
# ownership on every start.
RuntimeDirectory=mpd
RuntimeDirectoryMode=0755
